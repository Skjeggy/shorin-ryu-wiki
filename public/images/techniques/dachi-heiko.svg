<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="340" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Heiko-dachi sett ovenfra</title>
  <desc id="desc">To fotblad helt parallelt, i skulderbredde.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; }
    .floor { fill:#f7f5f1; stroke:#d7cdba; stroke-width:2; }
    .centerline { stroke:#d7cdba; stroke-width:1.5; stroke-dasharray:4 4; }
    .foot { fill:#463d31; fill-opacity:.14; stroke:#463d31; stroke-width:2; }
    .guide { stroke:#d97a7a; stroke-width:1.5; stroke-dasharray:3 3; }
    .label { font-size:11px; fill:#5f5240; }
    .legend { font-size:12px; fill:#5f5240; }
    .small { font-size:9px; fill:#998769; }
  </style>

  <rect class="floor" x="25" y="35" width="290" height="235" rx="10"/>
  <line class="centerline" x1="170" y1="35" x2="170" y2="270"/>
  <polygon points="170,10 164,20 176,20" fill="#7d6c52"/>
  <text x="170" y="24" text-anchor="middle" class="label">FRAM</text>

  <defs>
    <path id="foot" d="M0,-33 C9,-33 12,-24 12,-13 C12,2 9,12 8,20 C7,27 4,33 0,33 C-4,33 -7,27 -8,20 C-9,12 -12,2 -12,-13 C-12,-24 -9,-33 0,-33 Z"/>
  </defs>

  <use href="#foot" class="foot" transform="translate(131,155) rotate(0)"/>
  <use href="#foot" class="foot" transform="translate(209,155) rotate(0)"/>

  <line class="guide" x1="131" y1="112" x2="131" y2="198"/>
  <line class="guide" x1="209" y1="112" x2="209" y2="198"/>
  <text x="170" y="222" text-anchor="middle" class="label">fotblad helt parallelt</text>

  <text x="170" y="292" text-anchor="middle" class="legend">Samme som shizen-dachi, med tydelig parallell linje</text>
  <text x="170" y="308" text-anchor="middle" class="legend">Mye brukt i kihon-rekker</text>
  <text x="308" y="282" text-anchor="end" class="small">sett ovenfra · skjematisk</text>
</svg>
