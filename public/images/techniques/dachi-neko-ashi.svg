<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="340" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Neko-ashi-dachi sett ovenfra</title>
  <desc id="desc">Vekten nesten helt på bakre ben, fremre fot lett på tærne med hælen løftet.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; }
    .floor { fill:#f7f5f1; stroke:#d7cdba; stroke-width:2; }
    .centerline { stroke:#d7cdba; stroke-width:1.5; stroke-dasharray:4 4; }
    .foot-front { fill:#8b1d1d; fill-opacity:.16; stroke:#8b1d1d; stroke-width:2; stroke-dasharray:3 2; }
    .foot-back { fill:#463d31; fill-opacity:.14; stroke:#463d31; stroke-width:2; }
    .label { font-size:11px; fill:#5f5240; }
    .labelFront { font-size:11px; fill:#8b1d1d; font-weight:600; }
    .labelBack { font-size:11px; fill:#463d31; font-weight:600; }
    .legend { font-size:12px; fill:#5f5240; }
    .small { font-size:9px; fill:#998769; }
  </style>

  <rect class="floor" x="25" y="35" width="290" height="235" rx="10"/>
  <line class="centerline" x1="170" y1="35" x2="170" y2="270"/>
  <polygon points="170,10 164,20 176,20" fill="#7d6c52"/>
  <text x="170" y="24" text-anchor="middle" class="label">FRAM</text>

  <defs>
    <path id="foot" d="M0,-33 C9,-33 12,-24 12,-13 C12,2 9,12 8,20 C7,27 4,33 0,33 C-4,33 -7,27 -8,20 C-9,12 -12,2 -12,-13 C-12,-24 -9,-33 0,-33 Z"/>
  </defs>

  <use href="#foot" class="foot-back" transform="translate(186,178) rotate(45)"/>
  <use href="#foot" class="foot-front" transform="translate(154,120) rotate(0) scale(0.72)"/>

  <polyline points="154,80 150,90 158,90" fill="none" stroke="#8b1d1d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="72" text-anchor="middle" class="labelFront">hæl løftet</text>
  <text x="186" y="222" text-anchor="middle" class="labelBack">Bakre — 45° ut</text>

  <rect x="90" y="243" width="160" height="14" rx="3" fill="none" stroke="#b9aa8e" stroke-width="1.5"/>
  <rect x="90" y="243" width="16" height="14" rx="3" fill="#d97a7a" fill-opacity=".55"/>
  <rect x="106" y="243" width="144" height="14" rx="3" fill="#463d31" fill-opacity=".3"/>
  <text x="98" y="238" text-anchor="middle" class="label">10%</text>
  <text x="178" y="238" text-anchor="middle" class="label">90% bakre</text>

  <text x="170" y="288" text-anchor="middle" class="legend">Vekt nesten helt bak (ca. 90/10)</text>
  <text x="170" y="304" text-anchor="middle" class="legend">Distansering, hurtig tilgang til mae-geri</text>
  <text x="308" y="282" text-anchor="end" class="small">sett ovenfra · skjematisk</text>
</svg>
